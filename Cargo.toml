[package]
name = "rexy_sorter"
version = "1.0.0"
edition = "2021"
authors = ["Reyz"]
description = "Rexy Sorter - IPN-like inventory sorter mod for Horizon (Android)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
