name: Build .hnmod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Unit test sorter logic
        run: cargo test

      - name: Pack .hnmod
        run: python3 build.py

      - uses: actions/upload-artifact@v4
        with:
          name: rexy_sorter.hnmod
          path: dist/rexy_sorter.hnmod

      - name: Commit dist/
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f dist/rexy_sorter.hnmod
          git commit -m "ci: update dist/rexy_sorter.hnmod [skip ci]" || exit 0
          git push
